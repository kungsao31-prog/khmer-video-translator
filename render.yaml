services:
  - type: web
    name: cn-kh-ai-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: apt-get update && apt-get install -y ffmpeg fonts-noto-core && pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 1200
    healthCheckPath: /health
